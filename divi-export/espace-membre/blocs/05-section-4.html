<div id="cal-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1001;width:480px;max-width:95vw;max-height:80vh;overflow-y:auto;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.25)">
<div style="padding:22px 24px 16px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;border-radius:20px 20px 0 0">
<div>
<div style="font-size:12px;font-weight:600;color:var(--brun);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Planning</div>
<div id="cal-modal-title" style="font-weight:700;font-size:18px;color:var(--bleu)"></div>
</div>
<button onclick="closeCalModal()" onmouseout="this.style.background='none'" onmouseover="this.style.background='#f1f5f9'" style="background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:20px;transition:.15s"><i class="ti ti-x"></i></button>
</div>
