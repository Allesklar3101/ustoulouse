<section style="position:relative;min-height:100vh;display:flex;align-items:center;background:#020d18;overflow:hidden;font-family:'Poppins',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(2,13,24,.85) 0%,rgba(6,78,137,.3) 100%)"></div>

      <span style="width:24px;height:2px;background:#b8936a;display:inline-block;border-radius:2px"></span>Section ouverte depuis 2021
    </p>

    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button onclick="openPopup()" style="display:inline-flex;align-items:center;justify-content:center;background:#8b664b;color:#fff;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:14px 28px;border-radius:100px;border:none;cursor:pointer;font-family:'Poppins',system-ui,sans-serif">Rejoindre la section</button>
      <a href="#sorties" style="display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#fff;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:14px 28px;border-radius:100px;border:2px solid rgba(255,255,255,.4);text-decoration:none;font-family:'Poppins',system-ui,sans-serif">Nos sorties</a>
